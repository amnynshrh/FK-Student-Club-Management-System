<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login — FK Student Club & Event Management</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 d-flex align-items-center justify-content-center px-3 py-5">

    <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 420px; min-height: 600px;">
        <div class="card-body px-4 px-md-5 py-5">

            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="assets/images/uploads/logo-fk.png" alt="FK UMPSA Logo" class="mx-auto" style="width: 120px;">
            </div>

            <!-- Title -->
            <div class="text-center mb-4">
                <h1 class="fw-bold text-[#0054a6] mb-2" style="font-size: 26px;">
                    Login
                </h1>
                <p class="text-muted mb-0">
                    FK Student Club &amp; Event Management
                </p>
            </div>

            <!-- Error Message -->
            <div class="alert alert-danger d-none py-2 small" id="error-box">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span id="error-msg">Invalid username or password.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" method="post" action="api/auth/login.php">

                <!-- Role -->
                <div class="mb-4">
                    <label for="role-select" class="form-label fw-semibold">
                        Login As:
                    </label>
                    <select name="role" id="role-select" class="form-select py-3" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="admin">Administrator</option>
                        <option value="committee">Club Committee Member</option>
                        <option value="student">Registered Student</option>
                    </select>
                </div>

                <!-- Username -->
                <div class="mb-4">
                    <label for="matric_number" class="form-label fw-semibold">
                        Matric Number / Username
                    </label>
                    <input type="text" id="matric_number" name="username" class="form-control py-3"
                        placeholder="e.g., CB24161" autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">
                        <input type="password" id="password" name="password" class="form-control py-3"
                            placeholder="••••••••" autocomplete="current-password" required>

                        <button type="button" class="btn btn-outline-secondary px-3" id="toggle-password">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Button -->
                <button type="submit"
                    class="btn w-100 text-white fw-bold py-3 rounded-3 bg-[#0054a6] hover:bg-[#004487]">
                    Sign In
                </button>

            </form>

            <!-- Footer -->
            <div class="text-center mt-4">
                <p class="text-muted small mb-0">
                    Faculty of Computing<br>
                    Universiti Malaysia Pahang Al-Sultan Abdullah
                </p>
            </div>

        </div>
    </div>

    <script>
        // Check existing session
        (async () => {
            try {
                const res = await fetch('api/auth/session.php', {
                    credentials: 'same-origin'
                });

                const sess = await res.json();

                if (sess.loggedIn) {
                    window.location.href = `${sess.role}/home.php`;
                }
            } catch (error) {
                console.log('Session check skipped.');
            }
        })();

        // Password show/hide
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = 'Show';
            }
        });
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
