<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Committee</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Theme (UMPSA Theme) -->
    <link rel="stylesheet" href="../assets/css/committee.css">

    <style>
        /* Small overrides to make Bootstrap and Theme play nicely */
        body {
            background-color: #ffffff;
        }

        .table> :not(caption)>*>* {
            border-bottom-color: #eeeff2;
        }

        .btn-umpsa-teal {
            background-color: #009e96;
            color: white;
            transition: 0.2s;
        }

        .btn-umpsa-teal:hover {
            background-color: #1c3f95;
            color: white;
        }
    </style>
</head>

<body>

    <header class="top-navbar">
        <div class="nav-left">
            <img src="../assets/images/uploads/logo-fk.png" alt="FK Logo" class="nav-logo"
                onerror="this.src='../assets/images/logo-fk.png';">
            <div class="nav-brand">
                FK Student Club &<br>Management System
            </div>
        </div>

        <div class="nav-right">
            <a href="home.html" class="nav-link">Home</a>
            <a href="view_club.html" class="nav-link">View Club</a>
            <a href="manage_events.html" class="nav-link" style="color: #1c3f95; font-weight: 600;">Manage Events</a>
            <a href="manage_attendance.html" class="nav-link">Manage Attendance</a>
            <a href="attendance_record.html" class="nav-link">Attendance Records</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="../api/auth/logout.php" class="nav-link">Log Out</a>
        </div>
    </header>


    <main class="student-content">

        <div class="page-header">
            <h1 class="page-title">Add New Event</h1>

            <p class="page-subtitle">
                Create and publish a new event for FK students.
            </p>
        </div>

        <!-- Form Card -->
        <div class="event-form-card">

            <form action="#" method="POST">

                <!-- Event Title -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        Event Title <span class="required-star">*</span>
                    </label>

                    <input type="text" class="form-control form-control-custom" placeholder="Enter event title">
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        Description <span class="required-star">*</span>
                    </label>

                    <textarea class="form-control form-control-custom textarea-custom"
                        placeholder="Enter event description"></textarea>
                </div>

                <!-- Date & Time -->
                <div class="row">

                    <!-- Event Date -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label-custom">
                            Event Date <span class="required-star">*</span>
                        </label>

                        <div class="custom-input-wrapper">

                            <input type="date" class="form-control-custom custom-date-input">

                            <button type="button" class="input-icon-btn">
                                <i class="bi bi-calendar-event"></i>
                            </button>

                        </div>

                    </div>

                    <!-- Event Time -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label-custom">
                            Event Time <span class="required-star">*</span>
                        </label>

                        <div class="custom-input-wrapper">

                            <input type="time" class="form-control-custom custom-time-input">

                            <button type="button" class="input-icon-btn">
                                <i class="bi bi-clock"></i>
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Venue -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        Venue <span class="required-star">*</span>
                    </label>

                    <input type="text" class="form-control form-control-custom" placeholder="Enter venue">
                </div>

                <!-- Participants & Status -->
                <div class="row">

                    <!-- Max Participants -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label-custom">
                            Max Participants <span class="required-star">*</span>
                        </label>

                        <input type="number" class="form-control form-control-custom"
                            placeholder="Enter maximum participants">
                    </div>

                    <!-- Status -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label-custom">
                            Event Status <span class="required-star">*</span>
                        </label>

                        <select class="form-select form-select-custom">
                            <option selected disabled>
                                Select event status
                            </option>

                            <option>Upcoming</option>
                            <option>Ongoing</option>
                            <option>Completed</option>
                            <option>Cancelled</option>
                        </select>

                    </div>

                </div>

                <!-- Divider -->
                <div class="section-divider"></div>

                <!-- Buttons -->
                <div class="button-group-custom">

                    <a href="manage_events.html" class="btn-cancel-custom">
                        Cancel
                    </a>

                    <a href="manage_events.html" class="btn-save-custom">
                        <i class="bi bi-check-circle me-2"></i>
                        Save Event
                    </a>

                </div>

            </form>

        </div>

    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
