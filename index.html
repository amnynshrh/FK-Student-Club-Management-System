<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FK Student Club & Event Management System</title>
    <meta name="description"
        content="Login to the FK Student Club & Event Management System, UMPSA Faculty of Computing.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="bg-pattern"></div>
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <div class="login-wrapper">
        <!-- Left: Branding -->
        <div class="login-left">
            <div class="brand-logo">
                <img src="assets/images/fk.png" alt="FK UMPSA Logo"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback" style="display:none;">🎓</span>
            </div>
            <div class="brand-title">FK Student Club &<br>Event Management</div>
            <div class="brand-divider"></div>
            <div class="brand-subtitle">
                Faculty of Computing<br>
                Universiti Malaysia Pahang Al-Sultan Abdullah
            </div>
            <div class="brand-badges">
                <span class="brand-badge">Admin</span>
                <span class="brand-badge">Committee</span>
                <span class="brand-badge">Student</span>
            </div>
        </div>

        <!-- Right: Login Form -->
        <div class="login-right">
            <div class="form-header">
                <h1>Welcome Back 👋</h1>
                <p>Sign in with your matric number and password</p>
            </div>

            <!-- Error message -->
            <div class="error-box" id="error-box">
                <span>⚠️</span>
                <span id="error-msg"></span>
            </div>

            <form id="login-form" novalidate>
                <!-- Role selector -->
                <div class="form-group">
                    <label class="form-label">Login As</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <select name="role" id="role-select" class="form-control" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="admin">🔑 Administrator (FK Staff)</option>
                            <option value="committee">📋 Club Committee Member</option>
                            <option value="student">🎓 Registered Student</option>
                        </select>
                    </div>
                </div>

                <!-- Matric number -->
                <div class="form-group">
                    <label class="form-label" for="matric_number">Matric Number</label>
                    <div class="input-wrap">
                        <span class="input-icon">🪪</span>
                        <input type="text" id="matric_number" name="matric_number" class="form-control"
                            placeholder="e.g. CB24167 or ADMIN001" autocomplete="username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" id="pw-toggle" title="Show/hide password">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="login-btn">
                    <span id="btn-text">Sign In</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>

            <div class="form-footer">
                <span>BCS2243 Web Engineering &bull; Semester 2 2025/2026</span>
                FK Student Club &amp; Event Management System
            </div>
        </div>
    </div>

    <script>
        (async () => {
            // If already logged in, redirect
            try {
                const res = await fetch('/WEB PROJECT/api/auth/session.php', { credentials: 'same-origin' });
                const sess = await res.json();
                if (sess.loggedIn) {
                    window.location.href = `/WEB PROJECT/${sess.role}/home.html`;
                }
            } catch (_) { }
        })();

        // Password toggle
        document.getElementById('pw-toggle').addEventListener('click', function () {
            const pw = document.getElementById('password');
            if (pw.type === 'password') { pw.type = 'text'; this.textContent = '🙈'; }
            else { pw.type = 'password'; this.textContent = '👁'; }
        });

        // Login form submit
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const matric = document.getElementById('matric_number').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role-select').value;
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-msg');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const btn = document.getElementById('login-btn');

            // Hide previous error
            errorBox.style.display = 'none';

            if (!role) {
                errorMsg.textContent = 'Please select your role.';
                errorBox.style.display = 'flex';
                return;
            }
            if (!matric || !password) {
                errorMsg.textContent = 'Please enter your matric number and password.';
                errorBox.style.display = 'flex';
                return;
            }

            // Show loading
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/WEB PROJECT/api/auth/login.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ matric_number: matric, password }),
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Login failed.');

                // Optional: validate role matches
                if (data.role !== role) {
                    throw new Error(`You selected "${role}" but your account is registered as "${data.role}".`);
                }

                // Redirect
                window.location.href = '/WEB PROJECT/' + data.redirect.replace('../', '');
            } catch (err) {
                errorMsg.textContent = err.message;
                errorBox.style.display = 'flex';
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>

</html>
